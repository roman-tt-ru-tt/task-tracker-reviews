<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Новый отзыв · Task Tracker</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1><a href="/">⭐ Отзывы о Task Tracker</a></h1>
    <a class="btn" href="/">← Назад</a>
  </div>

  <div class="form">
    <h2>✍️ Написать отзыв</h2>

    <label>Оценка</label>
    <div class="rating-select" id="rating">
      <span data-v="1">★</span>
      <span data-v="2">★</span>
      <span data-v="3">★</span>
      <span data-v="4">★</span>
      <span data-v="5">★</span>
    </div>

    <label>Заголовок</label>
    <input type="text" id="title" maxlength="100" placeholder="Коротко о главном">

    <label>Текст отзыва</label>
    <textarea id="body" maxlength="2000" placeholder="Расскажи, как тебе Task Tracker: что нравится, что можно улучшить..."></textarea>

    <button id="sb" onclick="submit()">Отправить на модерацию</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script>
let rating = 0;

document.querySelectorAll('#rating span').forEach(el => {
  el.addEventListener('click', () => {
    rating = parseInt(el.dataset.v);
    document.querySelectorAll('#rating span').forEach(s => {
      s.classList.toggle('active', parseInt(s.dataset.v) <= rating);
    });
  });
});

async function submit() {
  const er = document.getElementById('err');
  const btn = document.getElementById('sb');
  const title = document.getElementById('title').value.trim();
  const body = document.getElementById('body').value.trim();

  if (!rating) { er.textContent = 'Поставь оценку'; return; }
  if (title.length < 3) { er.textContent = 'Заголовок минимум 3 символа'; return; }
  if (body.length < 10) { er.textContent = 'Текст минимум 10 символов'; return; }

  btn.disabled = true;
  er.textContent = '...';
  er.className = 'err';

  const r = await fetch('/api/reviews', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ rating, title, body }),
  });
  const d = await r.json();
  btn.disabled = false;

  if (d.ok) {
    er.className = 'err ok';
    er.textContent = '✅ ' + d.message + '. После одобрения отзыв появится на сайте.';
    document.getElementById('title').value = '';
    document.getElementById('body').value = '';
    rating = 0;
    document.querySelectorAll('#rating span').forEach(s => s.classList.remove('active'));
  } else if (r.status === 401) {
    location.href = '/login.html';
  } else {
    er.textContent = d.error || 'Ошибка';
  }
}
</script>
</body>
</html>
